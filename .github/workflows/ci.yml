name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI must never require an ANTHROPIC_API_KEY. No key is set below, so
  # `Settings.llm_enabled` is false throughout; agent tests replay recorded
  # fixtures from tests/fixtures/llm/ instead of making live calls — see
  # docs/07-AGENT.md. DEMO_MODE (a separate, now-removed config flag) used to
  # do this job too; docs/v2_migration change 12 deleted it.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenex
          POSTGRES_PASSWORD: tenex
          POSTGRES_DB: tenex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenex -d tenex"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://tenex:tenex@localhost:5432/tenex

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app datagen evals tests
          ruff format --check app datagen evals tests

      - name: Type-check the layers that carry the argument
        run: mypy app/detection app/agent app/graph

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - run: npm run lint
      - run: npm run typecheck
      # change 25 Contract row: "schema drift fails CI." Regenerates lib/api/schema.d.ts from
      # the committed backend/openapi.json (a checked-out file, not a live server — this job has
      # no Postgres/backend running) and diffs it against the committed one; fails the build if
      # a route changed without `python -m app.scripts.export_openapi` + `npm run gen:api` both
      # having been re-run. backend/tests/test_contract_openapi_schema.py is this check's other
      # half — it guards that backend/openapi.json itself hasn't drifted from app.main.app.
      - run: npm run verify:api-contract
      - run: npm run build

  # Enabled at M16. A regression beyond tolerance fails the build — see docs/12. Needs a live
  # Postgres (the real L1 Sigma rules and L2 events_dao have no DB-free code path — see
  # backend/evals/pipeline.py's module docstring) but never an ANTHROPIC_API_KEY: agent metrics
  # degrade to "not measured" (backend/evals/metrics/agent.py) rather than attempting a live
  # call, because no key is configured here either (see this workflow's top-level `env`).
  # `app/agent/orchestrator.py`/`verifier.py` exist; the gap is recorded tests/fixtures/llm/
  # fixtures to replay (a one-time task needing a live key, out of scope for CI) — see
  # evals/metrics/agent.py's module docstring. The one agent-dependent metric change 25 names as
  # a hard gate, injection_resistance == 1.0, does not wait on that: it is enforced live, with no
  # API key, in the `backend` job's own `pytest` step — see
  # backend/tests/test_agent_orchestrator.py::test_injection_resistance_across_all_canary_styles_is_1_0.
  eval-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenex
          POSTGRES_PASSWORD: tenex
          POSTGRES_DB: tenex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenex -d tenex"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://tenex:tenex@localhost:5432/tenex

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # lightgbm's Linux wheel dynamically links libgomp.so.1 — present on ubuntu-latest by
      # default, but installed explicitly so this job never depends on that staying true.
      - name: Install system OpenMP runtime (lightgbm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migrate
        run: alembic upgrade head

      - name: Golden dataset regression gate
        run: python -m evals.run

      - name: Upload results.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/evals/results.md
