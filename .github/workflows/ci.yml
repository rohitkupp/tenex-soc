name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI must never require an ANTHROPIC_API_KEY. No key is set anywhere in this file, so
# `Settings.llm_enabled` is false throughout; agent tests replay recorded fixtures from
# tests/fixtures/llm/ instead of making live calls — see docs/07-AGENT.md. DEMO_MODE (a
# separate, now-removed config flag) used to do this job too; docs/v2_migration change 12
# deleted it.
#
# This was a top-level `env:` key with nothing but the comment above under it. An `env:` whose
# mapping is empty parses as `''`, which GitHub rejects outright — "Invalid workflow file ...
# (Line: 12, Col: 5): Unexpected value ''" — so this workflow never ran at all, from the M0
# scaffold commit onward. Documenting the *absence* of a key needs a comment, not a key.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite needs every backing service, not just Postgres. With Postgres alone the queue,
    # upload, Redis-progress and Tier 2 tests all fail on connection-refused — around a hundred
    # of them — so this job could never have gone green even once the YAML parsed.
    #
    # No worker containers, deliberately. `tests/test_pipeline_retry.py` runs its own StageWorker
    # against a real stage queue; a live worker subscribed to the same queue would take half the
    # test's messages via RabbitMQ's round-robin. `conftest.no_competing_queue_consumers` warns
    # when that is happening.
    #
    # Ports and credentials match `Settings`' own defaults (app/core/config.py), so only
    # DATABASE_URL needs setting — the rest resolve to localhost with no env at all.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenex
          POSTGRES_PASSWORD: tenex
          POSTGRES_DB: tenex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenex -d tenex"
          --health-interval 5s --health-timeout 5s --health-retries 20

      tier2-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenex
          POSTGRES_PASSWORD: tenex
          POSTGRES_DB: tenex_tier2
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U tenex -d tenex_tier2"
          --health-interval 5s --health-timeout 5s --health-retries 20

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: tenex
          RABBITMQ_DEFAULT_PASS: tenex
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://tenex:tenex@localhost:5432/tenex
      TIER2_DATABASE_URL: postgresql+psycopg://tenex:tenex@localhost:5433/tenex_tier2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app datagen evals tests
          ruff format --check app datagen evals tests

      - name: Type-check the layers that carry the argument
        run: mypy app/detection app/agent app/graph

      # MinIO cannot be a `services:` entry: that block has no way to pass a command, and the
      # image needs `server /data`. Running it as a step is the standard workaround.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tenexminio -e MINIO_ROOT_PASSWORD=tenexminio123 \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Migrate
        run: alembic upgrade head

      # Tier 2 is `create_all`, not Alembic — a deliberate exception documented on
      # `app.core.db.init_tier2_schema`. Nothing else in CI would create these tables.
      - name: Create the Tier 2 schema
        run: python -c "from app.core.db import init_tier2_schema; init_tier2_schema()"

      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - run: npm run lint
      - run: npm run typecheck
      # change 25 Contract row: "schema drift fails CI." Regenerates lib/api/schema.d.ts from
      # the committed backend/openapi.json (a checked-out file, not a live server — this job has
      # no Postgres/backend running) and diffs it against the committed one; fails the build if
      # a route changed without `python -m app.scripts.export_openapi` + `npm run gen:api` both
      # having been re-run. backend/tests/test_contract_openapi_schema.py is this check's other
      # half — it guards that backend/openapi.json itself hasn't drifted from app.main.app.
      - run: npm run verify:api-contract
      - run: npm run build

  # Enabled at M16. A regression beyond tolerance fails the build — see docs/12. Needs a live
  # Postgres (the real L1 Sigma rules and L2 events_dao have no DB-free code path — see
  # backend/evals/pipeline.py's module docstring) but never an ANTHROPIC_API_KEY: agent metrics
  # degrade to "not measured" (backend/evals/metrics/agent.py) rather than attempting a live
  # call, because no key is configured anywhere in this workflow (see the note above `jobs:`).
  # `app/agent/orchestrator.py`/`verifier.py` exist; the gap is recorded tests/fixtures/llm/
  # fixtures to replay (a one-time task needing a live key, out of scope for CI) — see
  # evals/metrics/agent.py's module docstring. The one agent-dependent metric change 25 names as
  # a hard gate, injection_resistance == 1.0, does not wait on that: it is enforced live, with no
  # API key, in the `backend` job's own `pytest` step — see
  # backend/tests/test_agent_orchestrator.py::test_injection_resistance_across_all_canary_styles_is_1_0.
  eval-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenex
          POSTGRES_PASSWORD: tenex
          POSTGRES_DB: tenex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenex -d tenex"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://tenex:tenex@localhost:5432/tenex

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # lightgbm's Linux wheel dynamically links libgomp.so.1 — present on ubuntu-latest by
      # default, but installed explicitly so this job never depends on that staying true.
      - name: Install system OpenMP runtime (lightgbm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migrate
        run: alembic upgrade head

      # `backend/data/models/` is gitignored on purpose (see .gitignore's own note — the ECOD
      # and LOF artifacts embed their training matrices and are too large to commit), so a fresh
      # runner has no artifacts at all and `evals.run` died on the missing DGA weights before
      # evaluating anything. The gate has to fit what it grades.
      - name: Fit detector artifacts
        run: |
          python -m app.detection.evidence.dga_train
          python -m app.detection.ml.train

      - name: Golden dataset regression gate
        run: python -m evals.run

      - name: Upload results.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/evals/results.md
