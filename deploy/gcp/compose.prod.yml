# Production topology for the single GCE VM.
#
# This is the same service graph as the root docker-compose.yml — deliberately so.
# The deployed system and `make up` are the same system, which is what lets the
# README claim the queue topology is real rather than a diagram.
#
# Differences from dev, all of them intentional:
#   - No primary postgres service. The primary database is Supabase (managed, free,
#     pgvector 0.8.2). Tier 2 *does* run a local Postgres here: it is a separate database by
#     design (nothing identifiable crosses into it), it holds only derived, rebuildable data,
#     and putting it on Supabase would spend the free tier's 500MB on rows that can be
#     regenerated from the primary at any time.
#   - No source bind-mount and no --reload. The image is the artifact.
#   - Caddy terminates TLS. SameSite=None cookies are Secure-only, so plain HTTP
#     would silently break authentication (docs/06 decision record).
#   - Ports are not published except through Caddy; RabbitMQ and MinIO consoles
#     stay on the internal network rather than facing the public internet.

name: tenex-soc

x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL:?set in .env on the VM}
  # Tier 2's own database — the cross-tenant side of the boundary, written by the `anonymize`
  # stage which now runs after `triage`. A container on this VM, not Supabase: see the header.
  TIER2_DATABASE_URL: postgresql+psycopg://tenex:${TIER2_POSTGRES_PASSWORD:-tenex}@tier2-postgres:5432/tenex_tier2
  RABBITMQ_URL: amqp://tenex:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
  S3_BUCKET: tenex-uploads
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
  # The two spend controls. Both are in docker-compose.yml and were missing here, so production
  # ran on code defaults and the cap was *unsettable*: putting MAX_TRIAGE_INCIDENTS in the VM's
  # .env did nothing, because nothing passed it into the container. That is how a verification
  # run with an intended cap of 2 triaged until the account's credit balance hit zero -- $5.45
  # over 410k input tokens, ending in a 400 the retry policy then attempted three more times.
  #
  # Keep these defaults identical to docker-compose.yml. Drift between the two files is the bug
  # itself, not the values. Note what the ceiling costs before raising it: measured on
  # claude-opus-5, one triaged incident ran roughly $0.70-$2.70 depending on how many turns the
  # Analyst spent investigating, so 15 was a ~$10-40 upload. The switch to claude-sonnet-5 cuts
  # the rate to $3/$15 from $5/$25 (a ~0.6x multiplier on both), putting a triaged incident near
  # $0.40-$1.60 and 15 of them near $6-24 -- still the largest single lever on spend here.
  MAX_TRIAGE_INCIDENTS: ${MAX_TRIAGE_INCIDENTS:-15}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
  JWT_SECRET: ${JWT_SECRET:?}
  PSEUDONYM_SALT: ${PSEUDONYM_SALT:?}
  # M14. Both are in `_SENTINELS` (app/core/config.py), so the app refuses to boot outside `local`
  # while either is at its dev default — which is exactly how their absence here was found, on a
  # deploy that built cleanly and then failed at `alembic upgrade head`. `:?` rather than `:-` so
  # the next drift of this kind fails at `docker compose up` with the variable's name, instead of
  # inside a Python traceback one layer further in.
  TIER2_INDICATOR_SALT: ${TIER2_INDICATOR_SALT:?}
  TIER2_READONLY_DB_PASSWORD: ${TIER2_READONLY_DB_PASSWORD:?}
  # Email verification. `:-` and not `:?` — unlike the secrets above, these are genuinely
  # optional: with them unset `Settings.email_verification_enabled` is False and signup falls
  # back to stamping accounts verified on creation (app/api/auth.py). That fallback is what
  # keeps `make up` working with no Supabase project, so a missing value here must degrade
  # rather than refuse to boot. It does log a warning on every signup, which is the intended
  # way for an operator to notice a production deploy that lost these.
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
  ENVIRONMENT: production
  CORS_ORIGINS: ${CORS_ORIGINS:?}
  LOG_LEVEL: info

# Same shared shape as docker-compose.yml's x-worker-defaults — see that file's comment.
# No *source* bind-mount here (prod images are the artifact, per this file's header).
#
# `model_artifacts` is the exception, and deliberately a named volume rather than either a
# bind-mount or something baked into the image. Trained L3 artifacts are generated state, not
# source: `backend/data/models/` is gitignored, so `ship.sh`'s `git archive HEAD` cannot carry
# them, and the image build context therefore never contains them either. Before change 12 this
# was invisible — DEMO_MODE meant nothing loaded a model. Now `detect` hard-fails without a
# `feature_manifest.json`, and it failed exactly that way on the first real deploy after the
# migration: parse produced 3,358 events and the stage behind it died on a missing file.
#
# It must be shared, not per-service: training runs in one container and `detector`/`agent` are
# the ones that read the result, so anything written into a single container's writable layer is
# both invisible to them and lost on the next `up --build`. Provision once with
# `docker compose exec api python -m app.detection.ml.train`; the volume outlives rebuilds.
x-worker-defaults: &worker-defaults
  build:
    context: ../../backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: *worker-env
  volumes:
    - model_artifacts:/app/data/models
  depends_on:
    # The `anonymize` and `tier2` stages both write to the Tier 2 database, and every worker
    # shares this block, so all of them wait for it.
    tier2-postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    minio: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?e.g. 34-1-2-3.sslip.io}
    depends_on: [api]

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *worker-env
      # The API alone gets a bigger pool than the workers' 1+1. A worker processes one queue
      # message at a time, so one connection plus a spare is genuinely its ceiling — but the API
      # serves concurrent requests, and one analysis-page load fires five parallel DB-bound
      # fetches. At 1+1 those serialized through two connections, and when the Supabase outage
      # left both checkouts hung on dead sockets, every request — including login — waited 30s
      # and 500'd until the container was restarted. 4+6 covers a page load with headroom;
      # transaction-mode pooling on the Pro plan multiplexes it server-side either way.
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "6"
    expose: ["8000"]
    volumes:
      - model_artifacts:/app/data/models
    depends_on:
      tier2-postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'

  # Tier 2's database. pgvector because `tier2_signatures.embedding` is a vector(1024).
  # Not exposed through Caddy and no published port — nothing outside this compose network
  # has any reason to reach it.
  tier2-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenex
      POSTGRES_PASSWORD: ${TIER2_POSTGRES_PASSWORD:-tenex}
      POSTGRES_DB: tenex_tier2
    volumes: [tier2_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenex -d tenex_tier2"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tenex
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Worker process groups, one service per queue per docs/01 — same topology as
  # docker-compose.yml, deliberately (see this file's header comment). They share
  # *worker-env and *worker-defaults and differ only in their entrypoint module.

  orchestrator:
    <<: *worker-defaults
    command: python -m app.workers.orchestrator

  parser-zscaler:
    <<: *worker-defaults
    command: python -m app.workers.parser_zscaler

  enricher:
    <<: *worker-defaults
    command: python -m app.workers.enricher

  anonymizer:
    <<: *worker-defaults
    command: python -m app.workers.anonymizer

  detector:
    <<: *worker-defaults
    command: python -m app.workers.detector

  correlator:
    <<: *worker-defaults
    command: python -m app.workers.correlator

  agent:
    <<: *worker-defaults
    command: python -m app.workers.agent

  tier2-sync:
    <<: *worker-defaults
    command: python -m app.workers.tier2_sync

  dead-letter-sink:
    <<: *worker-defaults
    command: python -m app.workers.dead_letter_sink

volumes:
  caddy_data:
  caddy_config:
  rabbitmq_data:
  tier2_pgdata:
  minio_data:
  redis_data:
  # Trained L3 artifacts. Shared by api + every worker, and survives `up --build` —
  # see the x-worker-defaults comment for why this is state rather than source.
  model_artifacts:
