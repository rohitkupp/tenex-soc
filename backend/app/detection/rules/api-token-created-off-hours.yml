title: API token created outside business hours
id: api-token-created-off-hours
status: experimental
logsource:
  product: okta
  service: system
detection:
  token_create:
    activity_name: 'system.api_token.create'
    hour_utc|gte: 1.5
    hour_utc|lt: 9.0
  condition: token_create
level: medium
tags:
  - attack.persistence
  - attack.t1098.001
entity:
  type: user
  by: principal
description: >
  docs/04: "API token created outside business hours" (T1098.001) — a long-lived credential minted
  at a time nobody legitimately administers the tenant is a persistence red flag on its own.

  **`hour_utc` band derivation, stated honestly.** This is a coarser proxy than the L3 canonical
  per-user local-time `is_off_hours` (`app/detection/features.py`), which needs a per-user
  timezone the `events` row has no home for (OCSF carries a login's *geolocation*, not the
  principal's *employment* timezone — see `app.detection.sigma.fields`'s `_hour_utc` docstring
  for the full argument). Instead this rule uses the UTC band that is off-hours for *every*
  simulated office simultaneously: docs/11's three offices (US-CA UTC-8, US-NY UTC-5, IE-DU UTC+0)
  each nominally work local 09:00-17:30 (the mean of `datagen/org.py`'s per-user `WorkHours`
  draw), giving on-hours UTC bands of [17:00, 01:30+1) (CA), [14:00, 22:30) (NY) and
  [09:00, 17:30) (IE); their union covers all of UTC *except* [01:30, 09:00) — the band this rule
  uses. A real API-token-creation event inside that ~7.5-hour window is off-hours for literally
  everyone in the org, at the cost of missing a CA-local-night token creation that lands inside
  NY's or IE's business day (the tradeoff of a global band vs. a per-user one; state it, do not
  hide it).
