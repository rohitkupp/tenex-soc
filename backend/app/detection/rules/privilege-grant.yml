title: Privilege grant
id: privilege-grant
status: stable
logsource:
  product: okta
  service: system
detection:
  grant:
    activity_name: 'user.account.privilege.grant'
  condition: grant
level: medium
tags:
  - attack.privilege_escalation
  - attack.t1098
entity:
  type: user
  by: principal
description: >
  docs/04: "Privilege grant" (T1098) — every `user.account.privilege.grant` event, the last step
  of an account-takeover chain that wants to make its foothold administrative
  (`datagen/scenarios/s05_account_takeover.py`'s optional `grant_privilege` step) as well as a
  routine, legitimate part of onboarding (`datagen/scenarios/s10_benign_but_weird.py`'s
  new-hire scenario, whose grant deliberately comes from an `ADMIN_DEPARTMENTS` member's own
  normal device — the discriminator this rule cannot see on its own, which is exactly why it
  ships at `level: medium` and leans on downstream correlation/fusion rather than claiming
  certainty by itself).
