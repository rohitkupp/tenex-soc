title: Credentials in URL query string
id: credentials-in-url
status: stable
logsource:
  product: zscaler
  service: web
detection:
  cred_param:
    url_path|contains:
      - 'password='
      - 'passwd='
      - 'pwd='
      - 'api_key='
      - 'apikey='
      - 'access_token='
      - 'secret='
      - 'client_secret='
      - 'auth_token='
  condition: cred_param
level: medium
tags:
  - attack.credential_access
  - attack.t1552.001
entity:
  type: user
  by: principal
description: >
  A credential- or secret-shaped query parameter in a request path is a classic exfiltration/
  bad-practice signal (docs/04: "Credentials in URL query string") — secrets belong in headers or
  a request body, never a URL, which gets logged in plaintext by every proxy, load balancer and
  browser history along the way. `url_path` (docs/03: ZScaler's `url` field, "path and query
  only") is the hot column this checks; the literal list above is deliberately short and
  high-precision rather than a broad regex, to keep the benign false-positive rate low — see the
  M6 verification report's benign-corpus sweep for the measured count.
