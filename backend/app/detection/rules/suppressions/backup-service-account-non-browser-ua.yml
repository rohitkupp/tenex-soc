title: Suppress non-browser-UA / large-upload rules for catalogued backup service accounts
id: backup-service-account-non-browser-ua
status: stable
applies_to:
  - sigma.non_browser_user_agent
  - sigma.large_post_to_new_domain
reason: >
  docs/08 "Suppression rule generation": an analyst dismissed the recurring
  `sigma.non_browser_user_agent` / `sigma.large_post_to_new_domain` alerts on the org's own
  catalogued nightly backup job (docs/11 scenario 10's `benign_but_weird` false-positive
  control: a machine-regular, automation-UA, large-outbound-transfer service account talking to a
  SaaS storage app already in its own affinity set) with dismissal reason "known sanctioned
  backup job" — this is the accepted candidate exception that dismissal generated
  (docs/08: "generate a candidate Sigma exception rule ... present it to the analyst for review
  ... Accepted rules go to detection/rules/suppressions/"), committed here only after that
  review, never auto-applied.
logsource:
  product: zscaler
  service: web
detection:
  backup_account:
    principal: 'svc-backup@corp.example'
  condition: backup_account
level: informational
tags:
  - attack.t1105
entity:
  # The two suppressed rules (`non-browser-user-agent`, `large-post-to-new-domain`) both key
  # `entity.by` on `src_ip`, not `principal` -- a suppression's `entity.by` must match the *same*
  # dimension as whatever it is subtracting from (`app.detection.sigma.runner.run_rules` drops a
  # match purely by `entity_value` equality), so this resolves the backup account's own known
  # egress address, not the account name itself, even though the filter above still keys on
  # `principal` to select which rows belong to it.
  type: src_ip
  by: src_ip
