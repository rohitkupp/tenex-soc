title: Auth failure burst from an IP that also appears in proxy logs contacting a rare domain
id: xsrc-auth-burst-and-rare-domain
status: experimental
logsource:
  product: okta+zscaler
detection:
  auth_failures:
    activity_name: 'user.session.start'
    status: 'FAILURE'
  proxy_rare_domain:
    source_type: 'zscaler'
    domain_event_count|lte: 25
  timeframe: 60m
  condition: auth_failures | count(principal, max_each=3) by src_ip >= 10 and proxy_rare_domain
level: high
tags:
  - attack.credential_access
  - attack.command_and_control
  - attack.t1110
  - attack.t1071
entity:
  type: src_ip
  by: src_ip
description: >
  docs/04 cross-source rule: "Auth failure burst from an IP that also appears in proxy logs
  contacting a rare domain" (T1110 + T1071) — this is one of the three differentiators docs/04
  calls out as only working *because* both sources are normalized to OCSF onto the same
  `events` table with a shared `src_ip` hot column: neither half is suspicious alone (a handful of
  failed sign-ons happens constantly; browsing an unpopular-but-real domain happens constantly),
  but the same address doing both inside an hour is a genuinely different claim — most plausibly a
  spray tool running from a box that is also fetching a second-stage payload or checking in to
  infrastructure the org has never talked to before (`datagen/scenarios/s03_password_spray.py`'s
  whole premise: the same attacker `src_ip` threaded through both the Okta failures and the
  ZScaler requests). `domain_event_count` (`app.detection.sigma.fields`) is a deliberately coarse,
  L1-appropriate proxy for "rare" — a correlated in-analysis event count, not L2's own
  org-wide-calibrated `signal.rarity` score (a different package, `app/detection/signal/`, out of
  this rule's reach) — good enough to gate a cross-source join, not meant to replace L2's finer
  statistic.

  **The failure-burst half reuses `password-spray.yml`'s exact threshold
  (`count(principal, max_each=3) by src_ip >= 10`), not a lower one — tuned against real
  generated traffic.** An earlier version used a plain `count() by src_ip >= 5` (raw event count,
  no distinct-principal requirement); running the full rule set against
  `datagen/scenarios/s10_benign_but_weird.py` (`tests/test_rules_scenarios.py::
  test_scenario_10_benign_but_weird_produces_no_sigma_signals`) showed that rule firing
  repeatedly on its sanctioned pen-test sub-plot: 8 principals × 2 attempts from one admin's own
  known workstation, deliberately shaped to sit *under* `password-spray`'s ≥10-distinct-principal
  margin, still produces well over 5 raw failure events for that one `src_ip` inside 60 minutes,
  and that same admin's own ordinary afternoon browsing incidentally touches a handful of
  genuinely low-traffic (but harmless) domains. Matching the distinct-principal threshold this
  technique's *own* dedicated rule already uses closes that gap: a real T1110 spray is
  many-principals-few-attempts-each by definition, and "many raw failures, one or two accounts"
  is brute-force's shape (a different rule), not this one's.
