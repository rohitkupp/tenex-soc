title: Credential reset followed within 1h by large upload by same principal
id: xsrc-credential-reset-then-upload
status: experimental
logsource:
  product: okta+zscaler
detection:
  reset:
    activity_name:
      - 'user.account.reset_password'
      - 'user.account.reset_factor'
      - 'user.mfa.factor.reset_all'
  large_upload:
    source_type: 'zscaler'
    http_method: 'POST'
    bytes_out|gte: 10000000
  timeframe: 1h
  condition: reset | count() by principal >= 1 and large_upload
level: critical
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1567
entity:
  type: user
  by: principal
description: >
  docs/04 cross-source rule: "Credential reset followed within 1h by large upload by same
  principal" (T1567) — a credential/factor reset is the step that hands an attacker who already
  has partial access a clean, freshly-issued session; a large outbound transfer immediately after
  is what they came for. `reset | count() by principal >= 1 and large_upload` reuses the same
  anchor-aggregation shape as MFA fatigue and blocked-then-allowed with threshold 1 ("at least one
  reset in the preceding hour"), anchored on the upload — joined purely on `principal`, across
  `source_type`s, which is the cross-source join docs/04 asks these three rules to make for real.

  **Not exercised by any `datagen` scenario, stated honestly.** `reset`'s `activity_name` values
  are Okta's real System Log event names for a password/factor reset; no scenario in
  `datagen/scenarios/` currently emits one (the generator's Okta grammar,
  `datagen/emitters/okta.py`'s `_EVENT_META`, has no entry for them), so this rule has no
  generator-produced positive fixture to run end to end — `tests/fixtures/rules/
  xsrc-credential-reset-then-upload/` is hand-built instead (per docs/04: "Each rule needs a
  positive and a negative fixture", independent of whether a scenario exercises it), and its
  positive/negative fixture pair is what `tests/test_rules_fixtures.py` verifies.
