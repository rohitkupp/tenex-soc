title: Password spray
id: password-spray
status: stable
logsource:
  product: okta
  service: system
detection:
  attempts:
    activity_name: 'user.session.start'
    status: 'FAILURE'
  timeframe: 30m
  condition: attempts | count(principal, max_each=3) by src_ip >= 10
level: high
tags:
  - attack.credential_access
  - attack.t1110.003
entity:
  type: src_ip
  by: src_ip
description: >
  docs/04: "Password spray (≥10 distinct principals, ≤3 attempts each, one src_ip, 30m)"
  (T1110.003) — one source cycling low-and-slow through many accounts, never enough attempts
  against any single one to trip a lockout or the brute-force rule below, but wide enough across
  the org to be unmistakably automated. `count(principal, max_each=3) by src_ip >= 10` is Sigma's
  own distinct-count syntax (`count(field)` counts distinct values of `field`, vs. `count()`'s row
  count) plus this evaluator's `max_each` qualifier: only a principal whose *own* rolling attempt
  count against that `src_ip` stays at or under 3 within the 30-minute window counts toward the
  distinct total — which is exactly the "≤3 attempts each" half of the docs/04 threshold, not a
  separate check bolted on afterward. `datagen/scenarios/s03_password_spray.py`'s default
  configuration (18 principals × 2 attempts, one attacker `src_ip`, 22-minute burst) clears this
  with margin on both axes; `datagen/scenarios/s10_benign_but_weird.py`'s pen-test window is
  shaped to sit under both margins on purpose, as the negative control.
