title: Brute force
id: brute-force
status: stable
logsource:
  product: okta
  service: system
detection:
  failures:
    activity_name: 'user.session.start'
    status: 'FAILURE'
  timeframe: 15m
  condition: failures | count() by principal >= 20
level: high
tags:
  - attack.credential_access
  - attack.t1110.001
entity:
  type: user
  by: principal
description: >
  docs/04: "Brute force (≥20 failures, one principal, 15m)" (T1110.001) — the mirror image of
  password spray: many attempts concentrated on one account rather than a few attempts spread
  across many. A standalone `count() by principal >= 20` rolling-window aggregation (no anchor
  block): the first `user.session.start:FAILURE` event that pushes a principal's trailing
  15-minute failure count to 20 or more is the signal's trigger, with every failure in that
  window as evidence.
