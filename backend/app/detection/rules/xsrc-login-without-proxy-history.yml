title: Successful login from IP with no prior proxy history for that principal
id: xsrc-login-without-proxy-history
status: experimental
logsource:
  product: okta+zscaler
detection:
  okta_success:
    activity_name: 'user.session.start'
    status: 'SUCCESS'
  proxy_any:
    source_type: 'zscaler'
  condition: okta_success | not_seen_before(principal, src_ip) in proxy_any
level: medium
tags:
  - attack.initial_access
  - attack.t1078
entity:
  type: src_ip
  by: src_ip
description: >
  docs/04 cross-source rule: "Successful login from IP with no prior proxy history for that
  principal" (T1078) — the other differentiator that only works because both sources share one
  `src_ip` column: a legitimate sign-on's address is, almost always, an address the same
  principal's own proxy traffic has already established as theirs (their office egress, their
  home broadband) *before* this login. `not_seen_before(principal, src_ip) in proxy_any` reads
  the successful-login population (`okta_success`) against the proxy population (`proxy_any`, any
  ZScaler event — `source_type: 'zscaler'`, no disposition filter, since the point is presence in
  the proxy log at all, not what happened there) — with the same first-field-is-the-baseline
  convention as the new-country rule: this only fires once the principal *has* proxy history at
  all (from any address), just never from this one, which is what keeps a brand-new hire's very
  first login from tripping this rule for lack of any baseline.
  `datagen/scenarios/s03_password_spray.py`'s compromised principal's benign browsing history
  never includes the attacker's foreign `src_ip`, which is exactly this rule's target.

  **`level: medium`, downgraded from `high` after measuring its benign-corpus behavior**
  (`tests/test_rules_scenarios.py`, scenario 10). Every user in this org has exactly two
  addresses (`datagen/org.py`'s `User.source_ip`: office egress or home broadband, chosen
  per-session by `remote_ratio`) — real, honest "no history yet" happens whenever a principal's
  *first* switch to their less-common address (home vs. office) lands before their proxy traffic
  from that specific address has caught up, which a short observation window makes more likely,
  not a sign of compromise. That cold-start effect measured non-trivially even on
  `s10_benign_but_weird`'s ordinary background traffic, so this rule is scored as corroborating
  evidence rather than a standalone high-confidence alert — the same reasoning
  `non-browser-user-agent.yml` and `privilege-grant.yml` already document for their own
  context-blind false-positive modes.
