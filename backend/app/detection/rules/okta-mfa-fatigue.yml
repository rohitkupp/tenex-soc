title: Okta MFA fatigue
id: okta-mfa-fatigue
status: experimental
logsource:
  product: okta
  service: system
detection:
  failures:
    activity_name: 'user.authentication.auth_via_mfa'
    status: 'FAILURE'
  success:
    activity_name: 'user.authentication.auth_via_mfa'
    status: 'SUCCESS'
  timeframe: 15m
  condition: failures | count() by principal >= 5 and success
level: high
tags:
  - attack.credential_access
  - attack.t1621
entity:
  type: user
  by: principal
description: >
  docs/04's own worked example, verbatim: an attacker who already holds the password but not the
  second factor replays the push prompt (`user.authentication.auth_via_mfa:FAILURE`) until the
  victim taps accept out of alarm fatigue, closing with a `:SUCCESS`
  (`datagen/scenarios/s06_mfa_fatigue.py`). Five or more failures for one principal in the 15
  minutes before a success is the anchor-aggregation shape
  (`app.detection.sigma.compiler`'s "docs/04 worked example" strategy): `failures | count() by
  principal >= 5` is evaluated in the trailing window ending at every `success` event for that
  same principal.
