# Response action catalog — docs/08-RESPONSE-AND-LEARNING.md, Part 1, "Action catalog".
#
# `app.response.catalog` loads and validates this file. `app.response.planner` maps an agent's
# `recommended_actions[].action` (docs/07) to the `id` of a node here — anything that doesn't
# match an `id` byte-for-byte is REJECTED (free-text actions are not allowed), never coerced.
#
# Every action targets a REAL system in the response story (Okta, proxy policy, host inventory,
# API key management) even though ingest is ZScaler-proxy-only — see the top of this milestone's
# brief: "what you remediate is independent of what fed detection." The plane those targets are
# checked/mutated against (`enforcement_state`) is simulated; the graph reasoning, precondition
# checking, ordering, and rollback semantics that operate on it are not.
#
# ---------------------------------------------------------------------------------------------
# Modeling decisions this file depends on (docs/08 gives 3 illustrative nodes, not all 9 — the
# rest, and the state-shape bindings below, are this build's design, documented here rather than
# silently invented):
#
# * `enforcement_state.resource_type` is fixed by docs/02 to exactly
#   `proxy_policy|okta_session|okta_factor|host|api_key` — there is no `user`/`okta_user` type.
#   docs/08 says every principal gets "an Okta user record with sessions and factors" (singular
#   record). Since the enum has no home for identity-level flags (`credential_reset_required`,
#   account suspension), those live on the `okta_session` row (one per user, resource_id =
#   pseudonymized principal) alongside the session list — that row *is* the Okta user record for
#   this build. `okta_factor` (also one row per user) holds only the MFA factor list.
# * `proxy_policy` rows are shared by `block_domain_at_proxy` (resource_id = domain) and
#   `block_dst_ip` (resource_id = dst IP) — again, no separate resource_type for each. The
#   `state.kind` field ("domain" | "dst_ip") records which, purely for readability/debugging;
#   nothing branches on it because domain strings and dotted-quad/CIDR strings never collide as
#   `resource_id`s.
# * `quarantine_file`'s `target_type` is `host` (there is no `file` resource_type either — a
#   quarantined file is inventory *on* a host). Its `target` string is
#   `"<host_id>:<file_ref>"` — see `app.response.state.resolve_primary_resource`, the one place
#   that convention is parsed.
# * `depends_on` encodes two things: docs/08's explicit ordering constraint
#   (`force_credential_reset` after `revoke_okta_sessions` — "resetting first leaves live
#   sessions") and this build's extension of the same reasoning to the other two actions that
#   touch a still-authenticated user (`deactivate_compromised_mfa_factor`,
#   `suspend_user_account`): mutating a user's MFA factors or suspending the account while their
#   session is still live doesn't stop an attacker mid-session, so all three are ordered behind
#   session revocation. `block_domain_at_proxy`, `block_dst_ip`, `isolate_host`,
#   `disable_api_key`, and `quarantine_file` have no real-world ordering constraint on each other
#   or on the user actions, so they depend on nothing.
# * `mitre_mitigation` values are real ATT&CK Mitigation IDs (not fabricated — CLAUDE.md's "do
#   not fabricate ATT&CK technique IDs" rule, applied here to mitigations): M1018 User Account
#   Management, M1027 Password Policies, M1032 Multi-factor Authentication, M1030 Network
#   Segmentation, M1037 Filter Network Traffic, M1049 Antivirus/Antimalware.
# ---------------------------------------------------------------------------------------------

- id: revoke_okta_sessions
  name: Revoke all active sessions
  target_type: user
  preconditions:
    - user_exists
    - has_active_sessions
  effects:
    - okta_session.sessions[*].active = false
  blast_radius: user
  reversible: false # user must re-authenticate; there is no real-world "undo" for a forced logout
  rollback: null
  depends_on: []
  mitre_mitigation: M1018

- id: force_credential_reset
  name: Force password reset
  target_type: user
  preconditions:
    - user_exists
    - sessions_revoked # ordering matters — resetting first leaves live sessions (docs/08)
  effects:
    - okta_session.credential_reset_required = true
  blast_radius: user
  reversible: true
  rollback: clear_reset_flag
  depends_on: [revoke_okta_sessions]
  mitre_mitigation: M1027

- id: deactivate_compromised_mfa_factor
  name: Deactivate compromised MFA factor
  target_type: user
  preconditions:
    - user_exists
    - has_active_mfa_factor
  effects:
    - okta_factor.factors[*].active = false
  blast_radius: user
  reversible: true
  rollback: reactivate_mfa_factor
  depends_on: [revoke_okta_sessions]
  mitre_mitigation: M1032

- id: disable_api_key
  name: Disable API key
  target_type: api_key
  preconditions:
    - api_key_exists
    - api_key_enabled
  effects:
    - api_key.enabled = false
  blast_radius: user
  reversible: true
  rollback: reenable_api_key
  depends_on: []
  mitre_mitigation: M1018

- id: block_domain_at_proxy
  name: Block domain
  target_type: domain
  preconditions:
    - domain_not_allowlisted
  effects:
    - proxy_policy.blocked = true
  blast_radius: org # affects every user — flag prominently in the UI
  reversible: true
  rollback: unblock_domain
  depends_on: []
  mitre_mitigation: M1037

- id: block_dst_ip
  name: Block destination IP
  target_type: dst_ip
  preconditions:
    - dst_ip_not_allowlisted
  effects:
    - proxy_policy.blocked = true
  blast_radius: org
  reversible: true
  rollback: unblock_dst_ip
  depends_on: []
  mitre_mitigation: M1037

- id: isolate_host
  name: Isolate host from network
  target_type: host
  preconditions:
    - host_exists
    - host_not_isolated
  effects:
    - host.isolated = true
  blast_radius: host
  reversible: true
  rollback: rejoin_network
  depends_on: []
  mitre_mitigation: M1030

- id: suspend_user_account
  name: Suspend user account
  target_type: user
  preconditions:
    - user_exists
    - sessions_revoked
  effects:
    - okta_session.account_status = suspended
  blast_radius: user
  reversible: true
  rollback: reinstate_account
  depends_on: [revoke_okta_sessions]
  mitre_mitigation: M1018

- id: quarantine_file
  name: Quarantine file
  target_type: host
  preconditions:
    - host_exists
    - file_present
  effects:
    - host.files[file_ref].quarantined = true
  blast_radius: host
  reversible: true
  rollback: release_file
  depends_on: []
  mitre_mitigation: M1049
