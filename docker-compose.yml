name: tenex-soc

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://tenex:tenex@postgres:5432/tenex
  RABBITMQ_URL: amqp://tenex:tenex@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: tenexminio
  S3_SECRET_KEY: tenexminio123
  S3_BUCKET: tenex-uploads
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
  JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
  PSEUDONYM_SALT: ${PSEUDONYM_SALT:-dev-only-insecure-salt}
  TIER2_INDICATOR_SALT: ${TIER2_INDICATOR_SALT:-dev-only-insecure-shared-indicator-salt}
  TIER2_READONLY_DB_PASSWORD: ${TIER2_READONLY_DB_PASSWORD:-dev-only-insecure-tier2-readonly-password}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
  MAX_TRIAGE_INCIDENTS: ${MAX_TRIAGE_INCIDENTS:-15}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
  AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}

# Shared shape for every pipeline worker (docs/01-ARCHITECTURE.md services table) — one
# container per queue, all built from the same backend image, differing only in the
# `command:` module they run. `depends_on` on all four infra services (not just
# rabbitmq) because every worker touches Postgres and most touch Redis/MinIO too.
x-worker-defaults: &worker-defaults
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: *backend-env
  volumes:
    - ./backend:/app
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    minio: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tenex
      POSTGRES_PASSWORD: tenex
      POSTGRES_DB: tenex
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenex -d tenex"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tenex
      RABBITMQ_DEFAULT_PASS: tenex
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tenexminio
      MINIO_ROOT_PASSWORD: tenexminio123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time, not runtime — see frontend/Dockerfile.
        API_ORIGIN: ${API_ORIGIN:-http://api:8000}
    environment:
      # Browser-facing: the browser resolves this, so it must be a host address, not a
      # container name. Empty means same-origin — requests go to /api/* on :3000 and
      # next.config.ts's rewrite proxies them, which is what makes the session cookie
      # first-party (see that file).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      # Server-facing: the rewrite target and fetchServer's base, resolved *inside* the web
      # container, where `localhost` is the web container itself and not the API. This has to
      # be the compose service name. Without it every proxied request 500s and login is
      # impossible — which is exactly what happened, and it went unnoticed because Vercel
      # never runs this compose file and the web container had never been started.
      API_ORIGIN: ${API_ORIGIN:-http://api:8000}
    ports: ["3000:3000"]
    depends_on: [api]

  # --- Pipeline workers (docs/01-ARCHITECTURE.md services table) -------------------
  # One container per queue, one queue per worker (docs/01: "Each worker is a separate
  # container with its own queue... it demonstrates horizontal scale-out"). Every
  # command below is `python -m app.workers.<module>` — see backend/app/workers/.

  orchestrator:
    <<: *worker-defaults
    command: python -m app.workers.orchestrator

  parser-zscaler:
    <<: *worker-defaults
    command: python -m app.workers.parser_zscaler

  enricher:
    <<: *worker-defaults
    command: python -m app.workers.enricher

  anonymizer:
    <<: *worker-defaults
    command: python -m app.workers.anonymizer

  detector:
    <<: *worker-defaults
    command: python -m app.workers.detector

  correlator:
    <<: *worker-defaults
    command: python -m app.workers.correlator

  agent:
    <<: *worker-defaults
    command: python -m app.workers.agent

  tier2-sync:
    <<: *worker-defaults
    command: python -m app.workers.tier2_sync

  # Not one of docs/01's eleven named services — see
  # backend/app/pipeline/dead_letter_sink.py for why this process exists: it is the
  # single place `dead_letters` Postgres rows get written, for both app-level
  # exhausted-retry dead-letters and broker-native (killed-worker) ones.
  dead-letter-sink:
    <<: *worker-defaults
    command: python -m app.workers.dead_letter_sink

volumes:
  pgdata:
  miniodata:
